<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Caixa">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: uma coluna estreita, saldo grande no topo, lançar logo abaixo, listas por último. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --fg: #14211c;
  --muted: #5b6a63;
  --line: #dde3df;
  --chip: #e8eee9;
  --accent: #0f6b52;
  --accent-fg: #ffffff;
  --good: #0d7a4d;
  --bad: #b3392f;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #17211c; --fg: #e8efe9; --muted: #93a39a; --line: #26332c;
    --chip: #1f2c25; --accent: #4cc89a; --accent-fg: #08150f; --good: #4cc89a; --bad: #ef8478;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #17211c; --fg: #e8efe9; --muted: #93a39a; --line: #26332c;
  --chip: #1f2c25; --accent: #4cc89a; --accent-fg: #08150f; --good: #4cc89a; --bad: #ef8478;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-num); font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.saldo-label { color: var(--muted); font-size: 13px; }
.saldo { font-family: var(--font-num); font-size: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.neg { color: var(--bad); }
.monthnav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.monthnav button { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; }
.monthnav span { font-weight: 600; text-transform: capitalize; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--chip); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.in b { color: var(--good); } .out b { color: var(--bad); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"].t-in { background: var(--good); border-color: var(--good); color: var(--accent-fg); }
.seg button[aria-pressed="true"].t-out { background: var(--bad); border-color: var(--bad); color: var(--accent-fg); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.valor { font-family: var(--font-num); font-size: 22px; font-weight: 700; }
.add { grid-column: 1 / -1; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 16px; }
.err { grid-column: 1 / -1; color: var(--bad); font-size: 13px; min-height: 0; margin: 0; }
.cats { display: flex; flex-direction: column; gap: 10px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.cat .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.cat .bar i { display: block; height: 100%; border-radius: 3px; background: var(--bad); }
.cat.in .bar i { background: var(--good); }
.cat span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }
.sub { color: var(--muted); font-size: 12px; margin: 14px 0 8px; }
.sub:first-of-type { margin-top: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.item .m { color: var(--muted); font-size: 12.5px; grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.item .v { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; grid-column: 2; grid-row: 1; }
.item .v.in { color: var(--good); } .item .v.out { color: var(--bad); }
.item .x { grid-column: 2; grid-row: 2; justify-self: end; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 2px 0; text-decoration: underline; }
.item .x.sure { color: var(--bad); font-weight: 600; }
.empty { color: var(--muted); padding: 6px 0; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
<style>[hidden]{display:none!important}
.login{max-width:560px;margin:0 auto;min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.login img{width:72px;height:72px;border-radius:16px;margin:0 auto}
.login p{color:var(--muted);margin:0}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:12px 18px;font-weight:600;font-size:16px;cursor:pointer}
.gbtn[disabled]{opacity:.5;cursor:default}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<style>
.gbtn{background:var(--surface);color:var(--fg);border-color:var(--line)}
.gbtn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.loginform{display:flex;flex-direction:column;gap:10px;text-align:left}
.loginform input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
.loginform .linkbtn{align-self:center;margin-top:4px}
</style>
</head>
<body>
<div class="login" id="login">
  <img src="icon-192.png" alt="">
  <h1>Meu Caixa</h1>
  <p>Entre com seu e-mail e senha para salvar seus lançamentos com segurança e abrir em qualquer aparelho.</p>
  <form id="loginForm" class="loginform" autocomplete="on">
    <input id="email" type="email" autocomplete="username" placeholder="Seu e-mail" required>
    <input id="senha" type="password" autocomplete="current-password" placeholder="Senha (mínimo 6 caracteres)" required minlength="6">
    <button type="submit" class="gbtn primary" id="btnLogin">Entrar</button>
    <button type="button" class="gbtn" id="btnCriar">Criar conta</button>
    <button type="button" class="linkbtn" id="btnReset">Esqueci minha senha</button>
  </form>
  <p id="loginErr" role="alert" style="color:var(--bad);font-size:13px"></p>
</div>
<div class="wrap" id="appmain" hidden>
  <div class="top">
    <h1>Meu Caixa</h1>
    <div class="tabs" role="group" aria-label="Ver">
      <button type="button" data-perfil="Tudo" aria-pressed="true">Tudo</button>
      <button type="button" data-perfil="Pessoal" aria-pressed="false">Pessoal</button>
      <button type="button" data-perfil="Empresa" aria-pressed="false">Empresa</button>
    </div>
  </div>

  <section class="card" aria-label="Saldo">
    <div class="saldo-label" id="saldoLabel">Saldo atual</div>
    <div class="saldo" id="saldo">R$ 0,00</div>
    <div class="monthnav">
      <button type="button" id="prev" aria-label="Mês anterior">‹</button>
      <span id="mes"></span>
      <button type="button" id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="stats">
      <div class="stat in"><small>Entrou no mês</small><b id="sIn">R$ 0,00</b></div>
      <div class="stat out"><small>Saiu no mês</small><b id="sOut">R$ 0,00</b></div>
    </div>
  </section>

  <form class="card" id="form" autocomplete="off">
    <h2>Novo lançamento</h2>
    <div class="seg" role="group" aria-label="Tipo">
      <button type="button" class="t-in" data-tipo="entrada" aria-pressed="true">Entrou</button>
      <button type="button" class="t-out" data-tipo="saida" aria-pressed="false">Saiu</button>
    </div>
    <div class="grid">
      <div class="field full">
        <label for="valor">Valor</label>
        <input id="valor" class="valor" inputmode="decimal" placeholder="0,00">
      </div>
      <div class="field">
        <label for="cat">Categoria</label>
        <select id="cat"></select>
      </div>
      <div class="field">
        <label for="perfil">Conta</label>
        <select id="perfil"><option>Pessoal</option><option>Empresa</option></select>
      </div>
      <div class="field">
        <label for="desc" id="descLabel">Descrição (opcional)</label>
        <input id="desc" maxlength="80" placeholder="Ex: mercado">
      </div>
      <div class="field">
        <label for="data">Data</label>
        <input id="data" type="date">
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="add" type="submit">Adicionar</button>
    </div>
  </form>

  <section class="card" aria-label="Por categoria">
    <h2>Por categoria no mês</h2>
    <div id="cats"></div>
  </section>

  <section class="card" aria-label="Lançamentos">
    <h2>Lançamentos do mês</h2>
    <ul class="list" id="list"></ul>
  </section>

  <p class="foot"><span id="who"></span> · <button type="button" class="linkbtn" id="btnOut">Sair</button></p>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
(function () {
  var ENTRADAS = ["Salário", "Vendas", "Serviços", "Rendimentos", "Saldo inicial", "Outros"];
  var SAIDAS = ["Moradia", "Alimentação", "Transporte", "Saúde", "Lazer", "Educação", "Assinaturas", "Impostos", "Fornecedores", "Marketing", "Outros"];
  var LS_KEY = "meu-caixa-v1";

  var $ = function (id) { return document.getElementById(id); };
  var state = { items: [], filtro: "Tudo", tipo: "entrada", ym: "", pendingDel: null, uid: null };

  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  state.ym = today().slice(0, 7);

  function brl(c) { return (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }
  function parseValor(s) {
    s = String(s).replace(/[^\d.,-]/g, "");
    if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  function fmtData(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }

  function visible() {
    return state.items.filter(function (i) { return state.filtro === "Tudo" || i.perfil === state.filtro; });
  }

  function render() {
    var all = visible();
    var saldo = all.reduce(function (s, i) { return s + (i.tipo === "entrada" ? i.cents : -i.cents); }, 0);
    var el = $("saldo");
    el.textContent = brl(saldo);
    el.className = "saldo" + (saldo < 0 ? " neg" : "");
    $("saldoLabel").textContent = state.filtro === "Tudo" ? "Saldo atual (pessoal + empresa)" : "Saldo atual · " + state.filtro;

    var parts = state.ym.split("-");
    var nome = new Date(+parts[0], +parts[1] - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    $("mes").textContent = nome;

    var mes = all.filter(function (i) { return i.data.slice(0, 7) === state.ym; });
    var tin = 0, tout = 0, cin = {}, cout = {};
    mes.forEach(function (i) {
      if (i.tipo === "entrada") { tin += i.cents; cin[i.cat] = (cin[i.cat] || 0) + i.cents; }
      else { tout += i.cents; cout[i.cat] = (cout[i.cat] || 0) + i.cents; }
    });
    $("sIn").textContent = brl(tin);
    $("sOut").textContent = brl(tout);

    function block(titulo, map, cls) {
      var keys = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; });
      if (!keys.length) return "";
      var max = map[keys[0]];
      return '<p class="sub">' + titulo + "</p>" + keys.map(function (k) {
        return '<div class="cat ' + cls + '"><span>' + esc(k) + "</span><span>" + brl(map[k]) + '</span><div class="bar"><i style="width:' + Math.max(4, Math.round(map[k] / max * 100)) + '%"></i></div></div>';
      }).join("");
    }
    var catsHtml = block("Saídas", cout, "out") + block("Entradas", cin, "in");
    $("cats").innerHTML = '<div class="cats">' + (catsHtml || '<p class="empty">Nada lançado neste mês.</p>') + "</div>";

    mes.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : b.ts - a.ts; });
    if (!state.items.length) {
      $("list").innerHTML = '<li class="empty">Nenhum lançamento ainda. Para começar, lance o que você tem hoje na conta como <b>Entrou</b> na categoria <b>Saldo inicial</b>.</li>';
    } else if (!mes.length) {
      $("list").innerHTML = '<li class="empty">Nada lançado neste mês.</li>';
    } else {
      $("list").innerHTML = mes.map(function (i) {
        var sure = state.pendingDel === i.id;
        return '<li class="item"><div class="t">' + esc(i.desc || i.cat) + '</div>' +
          '<div class="v ' + (i.tipo === "entrada" ? "in" : "out") + '">' + (i.tipo === "entrada" ? "+" : "−") + " " + brl(i.cents) + "</div>" +
          '<div class="m">' + fmtData(i.data) + " · " + esc(i.cat) + " · " + esc(i.perfil) + "</div>" +
          '<button type="button" class="x' + (sure ? " sure" : "") + '" data-del="' + esc(i.id) + '">' + (sure ? "Confirmar exclusão" : "Excluir") + "</button></li>";
      }).join("");
    }
  }

  function fillCats() {
    var list = state.tipo === "entrada" ? ENTRADAS : SAIDAS;
    $("cat").innerHTML = list.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");
    syncOutros();
  }
  function syncOutros() {
    var o = $("cat").value === "Outros";
    $("descLabel").textContent = o ? "Do que se trata? (obrigatório)" : "Descrição (opcional)";
    $("desc").placeholder = o ? "Ex: pizza, conserto do carro" : "Ex: mercado";
  }

  var toastT;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 1800);
  }

  /* ---------- login e dados (Firebase) ---------- */
  var configured = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("COLE") < 0;
  var auth = null, fdb = null, unsub = null;

  function showApp(on) { $("login").hidden = on; $("appmain").hidden = !on; }
  function loginErr(msg, ok) { var el = $("loginErr"); el.textContent = msg || ""; el.style.color = ok ? "var(--good)" : "var(--bad)"; }
  function itemDoc(id) { return doc(fdb, "users", state.uid, "lancamentos", id); }
  function save(item) { return setDoc(itemDoc(item.id), item); }
  function remove(id) { return deleteDoc(itemDoc(id)); }

  function msgErro(e) {
    var c = e && e.code;
    if (c === "auth/invalid-email") return "E-mail inválido.";
    if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found") return "E-mail ou senha incorretos.";
    if (c === "auth/email-already-in-use") return "Este e-mail já tem conta. Toque em Entrar.";
    if (c === "auth/weak-password") return "Use uma senha com pelo menos 6 caracteres.";
    if (c === "auth/too-many-requests") return "Muitas tentativas. Espere alguns minutos.";
    if (c === "auth/network-request-failed") return "Sem internet. Tente de novo.";
    return "Não foi possível entrar. Tente de novo.";
  }
  function creds() { return { email: $("email").value.trim(), senha: $("senha").value }; }
  async function entrar() {
    loginErr("");
    var c = creds();
    if (!c.email || !c.senha) { loginErr("Digite e-mail e senha."); return; }
    try { await signInWithEmailAndPassword(auth, c.email, c.senha); } catch (e) { loginErr(msgErro(e)); }
  }
  async function criar() {
    loginErr("");
    var c = creds();
    if (!c.email || !c.senha) { loginErr("Digite e-mail e senha."); return; }
    try { await createUserWithEmailAndPassword(auth, c.email, c.senha); } catch (e) { loginErr(msgErro(e)); }
  }
  async function esqueci() {
    var c = creds();
    if (!c.email) { loginErr("Digite seu e-mail acima e toque em Esqueci minha senha."); return; }
    try { await sendPasswordResetEmail(auth, c.email); loginErr("Enviamos um e-mail para você criar uma nova senha. Veja também o spam.", true); }
    catch (e) { loginErr(msgErro(e)); }
  }

  function startFirebase() {
    showApp(false);
    $("loginForm").addEventListener("submit", function (e) { e.preventDefault(); if (auth) entrar(); });
    if (!configured) {
      $("btnLogin").disabled = true; $("btnCriar").disabled = true;
      loginErr("Falta configurar o Firebase: preencha o arquivo config.js (veja o LEIA-ME).");
      return;
    }
    var fapp = initializeApp(firebaseConfig);
    auth = getAuth(fapp);
    fdb = initializeFirestore(fapp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

    $("btnCriar").addEventListener("click", criar);
    $("btnReset").addEventListener("click", esqueci);
    $("btnOut").addEventListener("click", function () { signOut(auth); });

    onAuthStateChanged(auth, function (user) {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { state.uid = null; state.items = []; $("senha").value = ""; showApp(false); return; }
      state.uid = user.uid;
      $("who").textContent = user.email || "";
      $("senha").value = "";
      showApp(true);
      unsub = onSnapshot(collection(fdb, "users", user.uid, "lancamentos"), function (snap) {
        state.items = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        render();
      }, function () { toast("Sem conexão com seus dados. Tentando de novo."); });
    });
  }

  /* ---------- eventos ---------- */
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.filtro = b.dataset.perfil;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if (state.filtro !== "Tudo") $("perfil").value = state.filtro;
      render();
    });
  });
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.tipo = b.dataset.tipo;
      document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      fillCats();
    });
  });
  function shiftMonth(n) {
    var p = state.ym.split("-");
    var d = new Date(+p[0], +p[1] - 1 + n, 1);
    state.ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    render();
  }
  $("prev").addEventListener("click", function () { shiftMonth(-1); });
  $("next").addEventListener("click", function () { shiftMonth(1); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = parseValor($("valor").value);
    if (!(v > 0)) { $("err").textContent = "Digite um valor maior que zero. Exemplo: 49,90"; $("valor").focus(); return; }
    if ($("cat").value === "Outros" && !$("desc").value.trim()) { $("err").textContent = "Escreva do que se trata em Outros."; $("desc").focus(); return; }
    $("err").textContent = "";
    var item = {
      id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      tipo: state.tipo, cents: Math.round(v * 100), cat: $("cat").value, perfil: $("perfil").value,
      desc: $("desc").value.trim(), data: $("data").value || today(), ts: Date.now()
    };
    state.ym = item.data.slice(0, 7);
    if (state.filtro !== "Tudo" && state.filtro !== item.perfil) {
      state.filtro = item.perfil;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.perfil === state.filtro ? "true" : "false"); });
    }
    save(item).catch(function () { $("err").textContent = "Não foi possível salvar. Tente de novo."; });
    toast(item.tipo === "entrada" ? "Entrada salva" : "Saída salva");
    $("valor").value = ""; $("desc").value = ""; $("valor").focus();
    render();
  });

  var delT;
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-del]");
    if (!b) return;
    var id = b.dataset.del;
    if (state.pendingDel === id) {
      state.pendingDel = null;
      remove(id).catch(function () { toast("Não foi possível excluir"); });
      toast("Lançamento excluído");
    } else {
      state.pendingDel = id; render();
      clearTimeout(delT); delT = setTimeout(function () { state.pendingDel = null; render(); }, 4000);
    }
  });

  $("cat").addEventListener("change", syncOutros);
  $("data").value = today();
  fillCats();
  startFirebase();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
